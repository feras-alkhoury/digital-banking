spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.nexvia.digital_banking.TransferEvent

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/digital-banking